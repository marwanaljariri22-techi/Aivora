<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora - الذكاء الاصطناعي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#07111f,#101d35,#172b4d);
  color:white;
}

header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.logo{
  font-size:30px;
  font-weight:bold;
  letter-spacing:1px;
}

.logo span{
  color:#5ee7ff;
}

.menu button{
  background:rgba(255,255,255,.08);
  color:white;
  border:1px solid rgba(255,255,255,.15);
  padding:10px 18px;
  border-radius:12px;
  cursor:pointer;
}

.hero{
  max-width:1000px;
  margin:70px auto 30px;
  padding:20px;
  text-align:center;
}

.hero h1{
  font-size:48px;
  margin-bottom:20px;
}

.hero h1 span{
  color:#5ee7ff;
}

.hero p{
  font-size:19px;
  color:#cbd5e1;
  line-height:1.8;
}

.chat{
  max-width:850px;
  margin:40px auto;
  padding:20px;
}

.chat-box{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

textarea{
  width:100%;
  height:130px;
  resize:none;
  border:none;
  outline:none;
  border-radius:18px;
  padding:18px;
  font-size:17px;
  color:white;
  background:rgba(0,0,0,.25);
}

textarea::placeholder{
  color:#aab7c9;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:130px;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  color:white;
  background:#1769aa;
}

.actions button:hover{
  opacity:.85;
}
