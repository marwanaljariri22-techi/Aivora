<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#101827,#18243a);
    color:white;
    min-height:100vh;
}

.container{
    max-width:700px;
    margin:auto;
    padding:25px 15px;
}

h1{
    text-align:center;
    font-size:42px;
    margin:20px 0 5px;
}

.subtitle{
    text-align:center;
    color:#b8c4d6;
    margin-bottom:30px;
}

.chat{
    background:#111b2d;
    border-radius:20px;
    padding:20px;
    min-height:400px;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.message{
    padding:14px;
    border-radius:15px;
    margin:10px 0;
    line-height:1.7;
    white-space:pre-wrap;
}

.ai{
    background:#1d2a40;
}

.user{
    background:#304b73;
}

.input-area{
    display:flex;
    gap:10px;
    margin-top:15px;
}

input{
    flex:1;
    padding:15px;
    border:0;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

button{
    border:0;
    border-radius:12px;
    padding:0 22px;
    background:#4f8cff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.status{
    text-align:center;
    color:#9eabc0;
    margin-top:12px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>✨ Aivora</h1>
<div class="subtitle">مساعدك الذكي بالذكاء الاصطناعي</div>

<div class="chat" id="chat">
    <div class="message ai">
        أهلاً بك في Aivora 👋
        كيف يمكنني مساعدتك؟
    </div>
</div>

<div class="input-area">
    <input id="messageInput"
           type="text"
           placeholder="اكتب سؤالك هنا..."
           onkeydown="if(event.key==='Enter') sendMessage()">

    <button id="sendButton" onclick="sendMessage()">
        إرسال
    </button>
</div>

<div class="status" id="status"></div>

</div>

<script>

/* ضع مفتاح Gemini هنا للاختبار فقط */
const GEMINI_API_KEY = "ضع_مفتاح_GEMINI_هنا";

async function sendMessage(){

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if(!text) return;

    // رسالة المستخدم
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;
    chat.appendChild(userMessage);

    input.value = "";
    button.disabled = true;
    status.textContent = "Aivora يفكر...";

    // رسالة الذكاء الاصطناعي
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "جاري التفكير...";
    chat.appendChild(aiMessage);

    try{

        if(GEMINI_API_KEY === "ضع_مفتاح_GEMINI_هنا"){
            throw new Error("لم يتم وضع مفتاح Gemini API");
        }

        const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
        + GEMINI_API_KEY;

        const response = await fetch(url,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                contents:[
                    {
                        parts:[
                            {
                                text:text
                            }
                        ]
                    }
                ]
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "حدث خطأ في الاتصال"
            );
        }

        const answer =
        data.candidates?.[0]?.content?.parts?.[0]?.text;

        if(!answer){
            throw new Error("لم تصل إجابة من Gemini");
        }

        aiMessage.textContent = answer;

    }catch(error){

        aiMessage.textContent =
        "حدث خطأ: " + error.message;

    }finally{

        button.disabled = false;
        status.textContent = "";
        input.focus();

        chat.scrollTop = chat.scrollHeight;
    }
}

</script>

</body>
</html>
