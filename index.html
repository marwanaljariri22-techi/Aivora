<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aivora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
    }

    .subtitle {
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 15px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #94a3b8;
    }

    .chat-box {
      background: #1e293b;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .message {
      background: #334155;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .input-area input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .input-area button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #0ea5e9;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #0284c7;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      padding: 20px;
      color: #64748b;
      font-size: 14px;
    }

      .welcome h1 {
        font-size: 24px;
