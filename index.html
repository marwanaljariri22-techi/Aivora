<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora AI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#101827;
    color:white;
}
.box{
    max-width:700px;
    margin:auto;
    padding:20px;
}
h1{text-align:center;font-size:40px}
#chat{
    background:#18243a;
    min-height:400px;
    padding:15px;
    border-radius:15px;
}
.msg{
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    white-space:pre-wrap;
}
.user{background:#31598c}
.ai{background:#26364f}
.row{
    display:flex;
    gap:8px;
    margin-top:15px;
}
input{
    flex:1;
    padding:15px;
    border-radius:10px;
    border:0;
}
button{
    padding:15px 20px;
    border:0;
    border-radius:10px;
    background:#4f8cff;
    color:white;
}
</style>
</head>

<body>

<div class="box">

<h1>✨ Aivora</h1>

<div id="chat">
<div class="msg ai">أهلاً بك في Aivora 👋<br>أنا جاهز لمساعدتك.</div>
</div>

<div class="row">
<input id="input" placeholder="اكتب رسالتك...">
<button onclick="send()">إرسال</button>
</div>

</div>

<script>
AQ.Ab8RN6IQKXy930QxVq2_UaRVBV8WDk9giYiesqU3MXGjv_V3tA
/* 🔴 ضع مفتاح Gemini هنا 🔴 */
const GEMINI_API_KEY = "ضع_مفتاحك_هنا";


async function send(){

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if(!text) return;

    chat.innerHTML +=
    '<div class="msg user">' + text + '</div>';

    input.value = "";

    const ai = document.createElement("div");
    ai.className = "msg ai";
    ai.textContent = "Aivora يفكر...";
    chat.appendChild(ai);

    try{

        const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
        + GEMINI_API_KEY,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                contents:[{
                    parts:[{
                        text:text
                    }]
                }]
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "خطأ في الاتصال"
            );
        }

        ai.textContent =
        data.candidates[0].content.parts[0].text;

    }catch(error){

        ai.textContent =
        "❌ حدث خطأ: " + error.message;

    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
