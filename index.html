<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aivora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
    }

    .subtitle {
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 15px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .chat-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #0284c7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }

    #answer {
      margin-top: 20px;
      padding: 18px;
      background: #0f172a;
      border-radius: 12px;
      line-height: 1.8;
      color: #e2e8f0;
      min-height: 50px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .card h3 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5e1;
      line-height: 1.6;
    }
