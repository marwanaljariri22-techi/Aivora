<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1220,#172554,#0f172a);
color:white;
min-height:100vh;
}

.app{
max-width:900px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
padding:18px;
}

header{
text-align:center;
padding:28px 10px 18px;
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:22px;
background:linear-gradient(135deg,#7c3aed,#06b6d4);
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
}

h1{
margin:14px 0 6px;
font-size:34px;
}

.subtitle{
color:#b8c4d8;
}

.chat{
flex:1;
background:#ffffff0b;
border:1px solid #ffffff18;
border-radius:22px;
padding:18px;
min-height:420px;
overflow:auto;
}

.msg{
max-width:82%;
padding:13px 16px;
border-radius:18px;
margin:10px 0;
line-height:1.7;
white-space:pre-wrap;
}

.ai{
background:#1e293b;
margin-left:auto;
border-bottom-right-radius:5px;
}

.user{
background:#2563eb;
margin-right:auto;
border-bottom-left-radius:5px;
}

.welcome{
text-align:center;
color:#b8c4d8;
padding:100px 20px;
}

.composer{
display:flex;
gap:10px;
margin-top:14px;
}

textarea{
flex:1;
resize:none;
height:58px;
border:1px solid #ffffff20;
border-radius:17px;
background:#0f172acc;
color:white;
padding:16px;
font-size:16px;
outline:none;
}

button{
border:0;
border-radius:17px;
padding:0 24px;
background:linear-gradient(135deg,#7c3aed,#06b6d4);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:9px;
color:#91a0b8;
font-size:12px;
}

.clear{
background:transparent;
color:#aebbd0;
padding:6px 10px;
font-size:12px;
}

@media(max-width:600px){
.app{padding:10px}
.msg{max-width:90%}
h1{font-size:28px}
button{padding:0 16px}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">AI</div>
<h1>Aivora</h1>
<p class="subtitle">مساعدك الذكي</p>
</header>

<section class="chat" id="chat">

<div class="welcome" id="welcome">
<h2>مرحبًا بك في Aivora 👋</h2>
<p>اكتب رسالتك بالأسفل لبدء المحادثة.</p>
</div>

</section>

<div class="composer">

<textarea
id="input"
placeholder="اكتب رسالتك هنا..."
></textarea>

<button id="send">إرسال</button>

</div>

<div class="actions">

<span>اضغط Enter للإرسال</span>

<button class="clear" id="clear">
مسح المحادثة
</button>

</div>

</div>

<script>

const input=document.getElementById("input");
const send=document.getElementById("send");
const chat=document.getElementById("chat");
const clear=document.getElementById("clear");

function addMessage(text,type){

const welcome=document.getElementById("welcome");

if(welcome){
welcome.remove();
}

const div=document.createElement("div");

div.className="msg "+type;

div.textContent=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

function localReply(text){

const t=text.toLowerCase();

if(t.includes("مرحبا") || t.includes("السلام")){

return "مرحبًا بك! أنا Aivora 🤖 كيف يمكنني مساعدتك؟";

}

if(t.includes("اسمك")){

return "اسمي Aivora، مساعدك الذكي.";

}

if(t.includes("كيف حالك")){

return "أنا بخير وجاهز لمساعدتك 😊";

}

return "وصلت رسالتك: «"+text+"»\n\nواجهة Aivora تعمل بنجاح. في الخطوة التالية يمكننا ربطها بـ Gemini AI بطريقة آمنة.";

}

async function sendMessage(){

const text=input.value.trim();

if(!text || send.disabled){
return;
}

addMessage(text,"user");

input.value="";

send.disabled=true;

const thinking=document.createElement("div");

thinking.className="msg ai";

thinking.textContent="Aivora يفكر…";

chat.appendChild(thinking);

chat.scrollTop=chat.scrollHeight;

await new Promise(resolve=>setTimeout(resolve,700));

thinking.remove();

addMessage(localReply(text),"ai");

send.disabled=false;

input.focus();

}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});

clear.addEventListener("click",function(){

chat.innerHTML=`

<div class="welcome" id="welcome">

<h2>مرحبًا بك في Aivora 👋</h2>

<p>اكتب رسالتك بالأسفل لبدء المحادثة.</p>

</div>

`;

});

</script>

</body>
</html>
