<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#101827,#18243a,#0d1524);
color:white;
min-height:100vh
}

.app{
max-width:900px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column
}

header{
padding:25px 20px;
text-align:center;
border-bottom:1px solid #ffffff18
}

.logo{
font-size:36px;
font-weight:bold;
background:linear-gradient(90deg,#67e8f9,#a78bfa);
-webkit-background-clip:text;
color:transparent
}

.subtitle{
color:#aeb8cc;
margin-top:7px
}

.settings{
padding:15px 20px
}

.api-box{
display:flex;
gap:8px
}

input{
flex:1;
padding:14px;
border:1px solid #ffffff20;
border-radius:12px;
background:#ffffff0d;
color:white;
outline:none
}

input::placeholder{
color:#94a3b8
}

button{
border:0;
border-radius:12px;
padding:12px 18px;
cursor:pointer;
font-weight:bold
}

.save{
background:#7c3aed;
color:white
}

.chat{
flex:1;
padding:20px;
overflow-y:auto
}

.welcome{
text-align:center;
margin:80px 10px;
color:#b8c2d6
}

.welcome h2{
color:white;
font-size:28px
}

.message{
max-width:85%;
padding:15px 18px;
margin:12px 0;
border-radius:18px;
line-height:1.7;
white-space:pre-wrap
}

.user{
background:#4f46e5;
margin-right:auto
}

.ai{
background:#ffffff12;
border:1px solid #ffffff12;
margin-left:auto
}

.error{
background:#7f1d1d
}

.composer{
padding:15px 20px 25px;
display:flex;
gap:10px;
border-top:1px solid #ffffff15;
background:#0c1422cc
}

#messageInput{
font-size:16px
}

.send{
background:linear-gradient(135deg,#7c3aed,#4f46e5);
color:white;
min-width:90px
}

.send:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
text-align:center;
font-size:13px;
color:#94a3b8;
padding:7px
}

@media(max-width:600px){

.api-box{
flex-direction:column
}

.message{
max-width:95%
}

.composer{
padding:10px
}

}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">✦ Aivora</div>
<div class="subtitle">مساعدك الذكي</div>
</header>

<div class="settings">

<div class="api-box">

<input
id="apiKey"
type="password"
placeholder="ضع مفتاح Gemini API هنا"
autocomplete="off"
>

<button class="save" onclick="saveKey()">
حفظ المفتاح
</button>

</div>

<div id="status" class="status">
أدخل مفتاح Gemini للبدء
</div>

</div>

<div id="chat" class="chat">

<div class="welcome" id="welcome">

<h2>أهلًا بك في Aivora 👋</h2>

<p>
اكتب سؤالك وسأحاول مساعدتك.
</p>

</div>

</div>

<div class="composer">

<input
id="messageInput"
type="text"
placeholder="اكتب رسالتك هنا..."
onkeydown="handleKey(event)"
>

<button
id="sendButton"
class="send"
onclick="sendMessage()"
>
إرسال
</button>

</div>

</div>

<script>

const MODEL = "gemini-2.5-flash";

let apiKey =
localStorage.getItem("aivora_gemini_key") || "";

const apiInput =
document.getElementById("apiKey");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const chat =
document.getElementById("chat");

const statusBox =
document.getElementById("status");


if(apiKey){

apiInput.value = apiKey;

statusBox.textContent =
"✅ مفتاح Gemini محفوظ على هذا الجهاز";

}


function saveKey(){

const key =
apiInput.value.trim();

if(!key){

statusBox.textContent =
"⚠️ أدخل مفتاح Gemini أولًا";

return;

}

if(!key.startsWith("AIza")){

statusBox.textContent =
"⚠️ يبدو أن المفتاح غير صحيح. تأكد من نسخه كاملًا.";

return;

}

localStorage.setItem(
"aivora_gemini_key",
key
);

apiKey = key;

statusBox.textContent =
"✅ تم حفظ مفتاح Gemini بنجاح";

}


function handleKey(event){

if(event.key === "Enter"){

sendMessage();

}

}


function addMessage(text,type){

const welcome =
document.getElementById("welcome");

if(welcome){

welcome.remove();

}

const div =
document.createElement("div");

div.className =
"message " + type;

div.textContent =
text;

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

return div;

}


async function sendMessage(){

apiKey =
apiInput.value.trim() ||
apiKey;

if(!apiKey){

statusBox.textContent =
"⚠️ ضع مفتاح Gemini أولًا";

apiInput.focus();

return;

}

const text =
messageInput.value.trim();

if(!text){

return;

}

addMessage(text,"user");

messageInput.value = "";

sendButton.disabled = true;

statusBox.textContent =
"🤔 Aivora يفكر...";

const thinking =
addMessage(
"Aivora يفكر...",
"ai"
);


try{

const url =
"https://generativelanguage.googleapis.com/v1beta/models/"
+
MODEL
+
":generateContent?key="
+
encodeURIComponent(apiKey);


const response =
await fetch(url,{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

contents:[

{

role:"user",

parts:[

{
text:text
}

]

}

]

})

});


const data =
await response.json();


if(!response.ok){

throw new Error(
data?.error?.message ||
"تعذر الاتصال بـ Gemini"
);

}


const answer =
data?.candidates?.[0]?.content?.parts
?.map(part =>
part.text || ""
)
.join("")
.trim();


if(!answer){

throw new Error(
"Gemini لم يُرجع إجابة."
);

}


thinking.textContent =
answer;

statusBox.textContent =
"✅ تم الرد";


}catch(error){

console.error(
"Aivora Error:",
error
);

thinking.className =
"message error";


let errorText =
error.message || "";


if(
errorText.includes("API key") ||
errorText.includes("API_KEY")
){

errorText =
"مفتاح Gemini غير صحيح أو غير مفعّل.";

}


else if(
errorText.includes("quota") ||
errorText.includes("Quota")
){

errorText =
"تم تجاوز الحد المتاح لهذا المفتاح.";

}


else if(
errorText.includes("404")
){

errorText =
"النموذج غير متاح. جرّب إنشاء مفتاح Gemini جديد.";

}


else if(
errorText.includes("403")
){

errorText =
"ليس لديك صلاحية استخدام هذا المفتاح.";

}


thinking.textContent =
"❌ " + errorText;

statusBox.textContent =
"❌ حدث خطأ";


}finally{

sendButton.disabled =
false;

messageInput.focus();

}

}

</script>

</body>
</html>
