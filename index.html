<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivora - ذكاء اصطناعي يفهمك</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Tahoma",sans-serif;
  background:#080616;
  color:white;
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  background:#673ab7;
  filter:blur(130px);
  opacity:.35;
  top:-120px;
  right:-100px;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  background:#00bcd4;
  filter:blur(130px);
  opacity:.2;
  bottom:-120px;
  left:-100px;
  z-index:-1;
}

.header{
  padding:22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#9c7cff;
}

.status{
  font-size:12px;
  color:#6fffb0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 15px 120px;
}

.hero{
  text-align:center;
  padding:30px 10px;
}

.hero h1{
  font-size:38px;
  margin:10px 0;
}

.hero h1 span{
  color:#a98bff;
}

.hero p{
  color:#bbb5cc;
  font-size:16px;
}

.api-box{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:15px;
  margin:15px 0;
}

.api-title{
  font-weight:bold;
  margin-bottom:10px;
}

.api-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  background:#120e24;
  color:white;
  border:1px solid #3b3157;
  border-radius:12px;
  padding:13px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:#8d6cff;
  color:white;
}

.chat{
  margin-top:20px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  overflow:hidden;
}

.messages{
  min-height:330px;
  max-height:500px;
  overflow-y:auto;
  padding:18px;
}

.message{
  margin:10px 0;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.7;
  white-space:pre-wrap;
}

.user{
  background:#7255dc;
  margin-right:20%;
}

.ai{
  background:#171229;
  border:1px solid rgba(255,255,255,.08);
  margin-left:10%;
}

.welcome{
  text-align:center;
  color:#aaa3ba;
  padding:60px 10px;
}

.input-area{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid rgba(255,255,255,.08);
}

#prompt{
  width:100%;
}

.send{
  background:#9b7bff;
  color:white;
  min-width:90px;
}

.send:disabled{
  opacity:.5;
}

.footer{
  text-align:center;
  color:#777084;
  font-size:12px;
  margin-top:25px;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }

  .api-row{
    flex-direction:column;
  }

  .user{
    margin-right:5%;
  }

  .ai{
    margin-left:5%;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Ai<span>vora</span></div>
  <div class="status">● Gemini AI</div>
</header>

<main class="container">

<section class="hero">
  <h1>مرحبًا بك في <span>Aivora</span></h1>
  <p>ذكاء اصطناعي يفهمك ويساعدك</p>
</section>

<section class="api-box">
  <div class="api-title">🔑 مفتاح Gemini API</div>

  <div class="api-row">
    <input
      id="apiKey"
      type="password"
      placeholder="ضع مفتاح Gemini هنا"
    >

    <button class="save" onclick="saveKey()">
      حفظ
    </button>
  </div>

  <div id="keyStatus" style="margin-top:8px;color:#aaa;font-size:12px;"></div>
</section>

<section class="chat">

  <div id="messages" class="messages">

    <div class="welcome" id="welcome">
      <div style="font-size:45px;">✨</div>
      <h2>كيف يمكنني مساعدتك؟</h2>
      <p>اكتب سؤالك في الأسفل وابدأ المحادثة مع Aivora</p>
    </div>

  </div>

  <div class="input-area">

    <input
      id="prompt"
      type="text"
      placeholder="اكتب رسالتك هنا..."
      onkeydown="handleKey(event)"
    >

    <button
      id="sendBtn"
      class="send"
      onclick="sendMessage()"
    >
      إرسال
    </button>

  </div>

</section>

<div class="footer">
  Aivora © 2026
</div>

</main>

<script>

const API_URL =
"https://generativelanguage.googleapis.com/v1beta/interactions";

let apiKey = localStorage.getItem("aivora_gemini_key") || "";

const apiInput = document.getElementById("apiKey");
const keyStatus = document.getElementById("keyStatus");

if(apiKey){
  apiInput.value = apiKey;
  keyStatus.textContent = "✓ تم العثور على مفتاح محفوظ على هذا الجهاز";
}

function saveKey(){

  const key = apiInput.value.trim();

  if(!key){
    keyStatus.textContent = "أدخل مفتاح Gemini أولاً";
    return;
  }

  localStorage.setItem("aivora_gemini_key",key);
  apiKey = key;

  keyStatus.textContent =
    "✓ تم حفظ المفتاح على هذا الجهاز";

}

function handleKey(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}

function addMessage(text,type){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const messages =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  return div;

}

async function sendMessage(){

  const input =
    document.getElementById("prompt");

  const button =
    document.getElementById("sendBtn");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  if(!apiKey){

    addMessage(
      "أدخل مفتاح Gemini API أولاً ثم اضغط حفظ.",
      "ai"
    );

    return;
  }

  addMessage(text,"user");

  input.value = "";

  button.disabled = true;
  button.textContent = "جاري...";

  const loading =
    addMessage("Aivora يفكر...","ai");

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":apiKey
        },

        body:JSON.stringify({

          model:"gemini-3.7-flash",

          input:text

        })

      });

    const data =
      await response.json();

    loading.remove();

    if(!response.ok){

      let errorMessage =
        "حدث خطأ أثناء الاتصال بـ Gemini.";

      if(data.error && data.error.message){
        errorMessage =
          data.error.message;
      }

      addMessage(
        "❌ " + errorMessage,
        "ai"
      );

      return;
    }

    let answer = "";

    if(data.output_text){
      answer = data.output_text;
    }
    else if(data.steps){

      for(const step of data.steps){

        if(
          step.type === "model_output" &&
          step.content
        ){

          for(const item of step.content){

            if(item.type === "text"){
              answer += item.text;
            }

          }

        }

      }

    }

    if(!answer){
      answer =
        "لم أستطع الحصول على رد من Gemini.";
    }

    addMessage(answer,"ai");

  }
  catch(error){

    loading.remove();

    addMessage(
      "❌ تعذر الاتصال بالذكاء الاصطناعي. تأكد من الإنترنت ومفتاح API.",
      "ai"
    );

  }
  finally{

    button.disabled = false;
    button.textContent = "إرسال";

  }

}

</script>

</body>
</html>
